<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Repeater</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f4f8;
    color: #222;
}

.container {
    width: 92%;
    max-width: 600px;
    margin: 40px auto;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.12);
}

h1 {
    text-align: center;
    margin-bottom: 10px;
}

p {
    text-align: center;
    color: #666;
}

label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 10px;
    background: #1976d2;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

#result {
    margin-top: 20px;
    padding: 15px;
    min-height: 100px;
    max-height: 400px;
    overflow: auto;
    background: #f5f5f5;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
}
</style>
</head>

<body>

<div class="container">

<div class="box">

<h1>🔁 Word Repeater</h1>

<p>कोई भी शब्द लिखें और जितनी बार चाहें दोहराएँ।</p>

<label>Word या Text</label>

<input
    type="text"
    id="word"
    placeholder="जैसे: Hello"
>

<label>कितनी बार लिखना है?</label>

<input
    type="number"
    id="count"
    min="1"
    max="1000000"
    placeholder="जैसे: 1000"
>

<button onclick="repeatWord()">
    Generate
</button>

<div id="result">
    आपका result यहाँ दिखाई देगा।
</div>

<button onclick="copyResult()">
    📋 Copy Result
</button>

</div>

</div>

<script>

function repeatWord() {

    let word = document.getElementById("word").value;
    let count = Number(document.getElementById("count").value);
    let result = document.getElementById("result");

    if (word.trim() === "") {
        result.textContent = "पहले कोई word लिखें।";
        return;
    }

    if (count < 1 || count > 1000000) {
        result.textContent = "1 से 10 लाख के बीच संख्या डालें।";
        return;
    }

    result.textContent = Array(count).fill(word).join(" ");
}

function copyResult() {

    let result = document.getElementById("result").textContent;

    if (!result || result === "आपका result यहाँ दिखाई देगा।") {
        return;
    }

    navigator.clipboard.writeText(result);

    alert("Result copy हो गया!");
}

</script>

</body>
</html>
